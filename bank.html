<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinewell Bank</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ee;--surface:#fff;--ink:#14231c;--muted:#5d6e64;--line:#d5ddd6;--accent:#1d5a42;--accent-ink:#fff;--bad:#b3362b;--bad-bg:#f8e4e1;--good:#1d5a42;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--surface:#17251d;--ink:#e6efe9;--muted:#93a69b;--line:#29392f;--accent:#6fcf9f;--accent-ink:#0f1a14;--bad:#ff8a7d;--bad-bg:#3a1e1a;--good:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a14;--surface:#17251d;--ink:#e6efe9;--muted:#93a69b;--line:#29392f;--accent:#6fcf9f;--accent-ink:#0f1a14;--bad:#ff8a7d;--bad-bg:#3a1e1a;--good:#6fcf9f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:1.25rem;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-size:.875rem;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:500;padding:10px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:14px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);margin:0}
button.sm{padding:6px 10px;font-size:.85rem;margin:0}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.balance{font-size:2.6rem;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.muted{color:var(--muted);font-size:.9rem}
.msg{padding:10px 12px;border-radius:6px;margin-top:12px;font-size:.92rem}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--bg);color:var(--good);border:1px solid var(--line)}
.banner{background:var(--bad-bg);color:var(--bad);padding:12px 14px;border-radius:8px;margin-bottom:16px;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row>div:first-child{min-width:0}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--good)}
.tag{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--bad-bg);color:var(--bad);margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scroll{overflow-x:auto}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY="pinewell_v1";
let mem=null;
function seed(){const t=Date.now();return{accounts:[
{u:"admin",name:"Bank Admin",pin:"0000",bal:0,admin:true,restricted:false},
{u:"ada",name:"Ada Okafor",pin:"1111",bal:2500,admin:false,restricted:false},
{u:"ben",name:"Ben Carter",pin:"2222",bal:800,admin:false,restricted:false}],
tx:[{id:1,t,from:null,to:"ada",amt:2500,note:"Opening balance"},{id:2,t,from:null,to:"ben",amt:800,note:"Opening balance"}]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||(mem=seed())}
function save(){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
let db=load(),me=null,flash=null,view="home";
function newAcct(){let n;do{n=String(Math.floor(1e9+Math.random()*9e9))}while(db.accounts.some(a=>a.acct===n));return n}
db.accounts.forEach(a=>{if(!a.acct)a.acct=newAcct()});save();
const $=(s)=>document.querySelector(s);
const money=n=>n.toLocaleString(undefined,{style:"currency",currency:"USD"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const acct=u=>db.accounts.find(a=>a.u===u);
const when=t=>new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});
function setFlash(type,text){flash={type,text}}
function flashHtml(){const f=flash;flash=null;return f?`<div class="msg ${f.type}" role="status">${esc(f.text)}</div>`:""}

function render(){
  const app=$("#app");
  if(!me){app.innerHTML=loginView();return}
  me=acct(me.u);
  app.innerHTML=`<header><h1>Pinewell Bank</h1><div><span class="muted">${esc(me.name)}</span> <button class="ghost sm" id="out">Sign out</button></div></header>`+(me.admin?adminView():userView());
  $("#out").onclick=()=>{me=null;render()};
  bind();
}
function loginView(){return`<header><h1>Pinewell Bank</h1></header><div class="card"><h2>Sign in</h2>
<label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="none">
<label for="lp">PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password">
<button id="go">Sign in</button>${flashHtml()}</div>`}
function historyHtml(list,forUser){
  if(!list.length)return`<p class="muted">No transactions yet.</p>`;
  return list.slice().sort((a,b)=>b.t-a.t).map(x=>{
    const out=forUser&&x.from===forUser, dest=esc(x.toName||x.to),label=x.from===null?"Deposit":`${esc(x.from)} to ${dest}`;
    const sign=forUser?(out?"−":"+"):"";
    return`<div class="row"><div><div>${forUser?(x.from===null?"Deposit":out?"Sent to "+dest:"Received from "+esc((acct(x.from)||{}).name||x.from)):label}</div><div class="muted">${when(x.t)}${x.note?" · "+esc(x.note):""}</div></div><div class="amt ${forUser&&!out?"in":""}">${sign}${money(x.amt)}</div></div>`}).join("");
}
function userView(){
  const mine=db.tx.filter(x=>x.from===me.u||x.to===me.u);
  return`${me.restricted?`<div class="banner">Your account is restricted. You can't send or receive money. Contact the bank.</div>`:""}
<div class="card"><div class="muted">Available balance</div><div class="balance">${money(me.bal)}</div><div class="muted">Account ${esc(me.acct)}</div></div>
<div class="card"><h2>Send money</h2><div class="grid"><div><label for="tn">Recipient name</label><input id="tn"></div>
<div><label for="ta">Account number</label><input id="ta" inputmode="numeric"></div></div>
<label for="amt">Amount (USD)</label><input id="amt" type="number" min="0.01" step="0.01" inputmode="decimal">
<label for="note">Note (optional)</label><input id="note" maxlength="60">
<button id="send" ${me.restricted?"disabled":""}>Send money</button>${flashHtml()}</div>
<div class="card"><h2>History</h2>${historyHtml(mine,me.u)}</div>`}
function adminView(){
  const users=db.accounts.filter(a=>!a.admin);
  return`<div class="card"><h2>Create account</h2><div class="grid"><div><label for="nn">Full name</label><input id="nn"></div>
<div><label for="nu">Username</label><input id="nu" autocapitalize="none"></div>
<div><label for="np">4-digit PIN</label><input id="np" inputmode="numeric" maxlength="4"></div>
<div><label for="nb">Opening balance (USD)</label><input id="nb" type="number" min="0" step="0.01" value="0"></div></div>
<button id="create">Create account</button>${flashHtml()}</div>
<div class="card"><h2>Accounts (${users.length})</h2>${users.map(a=>`<div class="row"><div><div>${esc(a.name)}${a.restricted?'<span class="tag">Restricted</span>':""}</div><div class="muted">@${esc(a.u)} · Acct ${esc(a.acct)} · ${money(a.bal)}</div></div>
<button class="sm ${a.restricted?"":"danger"}" data-r="${esc(a.u)}">${a.restricted?"Lift restriction":"Restrict"}</button></div>`).join("")||'<p class="muted">No customer accounts yet. Create one above.</p>'}</div>
<div class="card"><h2>All transactions</h2>${historyHtml(db.tx,null)}</div>`}
function bind(){
  const s=$("#send");if(s)s.onclick=send;
  const c=$("#create");if(c)c.onclick=create;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const a=acct(b.dataset.r);a.restricted=!a.restricted;save();setFlash("ok",`${a.name} is now ${a.restricted?"restricted":"active"}.`);render()});
}
function send(){
  const tn=$("#tn").value.trim(),ta=$("#ta").value.replace(/\s/g,""),amt=Math.round(parseFloat($("#amt").value)*100)/100,note=$("#note").value.trim();
  const r=db.accounts.find(a=>a.acct===ta&&!a.admin);let e="";
  if(me.restricted)e="Your account is restricted.";
  else if(!tn)e="Enter the recipient’s name.";
  else if(!/^\d{6,17}$/.test(ta))e="Account number must be 6–17 digits.";
  else if(ta===me.acct)e="You can’t send money to your own account.";
  else if(r&&r.restricted)e="That account can’t receive money right now.";
  else if(!(amt>0))e="Enter an amount greater than 0.";
  else if(amt>me.bal)e=`Not enough funds. Your balance is ${money(me.bal)}.`;
  if(e){setFlash("err",e);render();return}
  me.bal=Math.round((me.bal-amt)*100)/100;if(r)r.bal=Math.round((r.bal+amt)*100)/100;
  db.tx.push({id:Date.now(),t:Date.now(),from:me.u,to:r?r.u:null,toName:tn,toAcct:ta,amt,note});save();
  setFlash("ok",`Sent ${money(amt)} to ${tn}.`);render();
}
function create(){
  const name=$("#nn").value.trim(),u=$("#nu").value.trim().toLowerCase(),pin=$("#np").value.trim(),bal=Math.round((parseFloat($("#nb").value)||0)*100)/100;
  let e="";
  if(!name)e="Enter the customer's full name.";
  else if(!/^[a-z0-9_]{3,20}$/.test(u))e="Username must be 3–20 letters, numbers or underscores.";
  else if(acct(u))e="That username is taken.";
  else if(!/^\d{4}$/.test(pin))e="PIN must be exactly 4 digits.";
  else if(bal<0)e="Opening balance can't be negative.";
  if(e){setFlash("err",e);render();return}
  const an=newAcct();db.accounts.push({u,name,pin,bal,acct:an,admin:false,restricted:false});
  if(bal>0)db.tx.push({id:Date.now(),t:Date.now(),from:null,to:u,amt:bal,note:"Opening balance"});
  save();setFlash("ok",`Created @${u}. Account number: ${an}.`);render();
}
document.addEventListener("click",e=>{
  if(e.target.id!=="go")return;
  const a=acct($("#lu").value.trim().toLowerCase());
  if(!a||a.pin!==$("#lp").value){setFlash("err","Username or PIN is incorrect.");render();return}
  me=a;render();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!me&&$("#go"))$("#go").click()});
render();
</script>
</body>
</html>
